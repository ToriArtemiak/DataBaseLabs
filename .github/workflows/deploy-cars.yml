name: Deploy Cars full aouto

on:
  push:
    branches: [ lab5 ]
  workflow_dispatch:

concurrency:
  group: cars-deploy-lab5
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) підготуємо staging-директорію на EC2
      - name: Prepare staging dir on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            mkdir -p /home/ubuntu/cars_staging

      # 2) заливаємо код у STAGING (не у бойову папку)
      - name: Upload project to EC2 (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "**"
          target: "/home/ubuntu/cars_staging"
          overwrite: true
          strip_components: 0

      # 3) інсталимо залежності у staging, робимо імпорт-тест
      - name: Stage, test, conditional deploy & soft restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            STAGE_DIR="/home/ubuntu/cars_staging"
            LIVE_DIR="/home/ubuntu/cars"

            echo "::group::Install system packages"
            sudo apt-get update -y
            sudo apt-get install -y python3-venv python3-pip rsync curl
            echo "::endgroup::"

            echo "::group::Prepare venv in staging"
            cd "$STAGE_DIR"
            python3 -m venv .venv || true
            . .venv/bin/activate
            pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
            echo "::endgroup::"

            echo "::group::WSGI import test (staging)"
            set +e
            /home/ubuntu/cars_staging/.venv/bin/python -c 'import sys,traceback; sys.path.insert(0,"/home/ubuntu/cars_staging"); 
try:
    from wsgi import app
    print("WSGI OK:", bool(app))
except Exception as e:
    print("WSGI IMPORT FAILED:", e)
    traceback.print_exc()
    raise SystemExit(1)'
            TEST_RC=$?
            set -e
            echo "::endgroup::"

            if [ "$TEST_RC" -eq 0 ]; then
              echo "::group::Deploying to LIVE (atomic sync) & restart"
              sudo tar -czf "/home/ubuntu/cars_backup_$(date +%F_%H%M%S).tgz" -C /home/ubuntu cars || true

              # Синхронізація у бойову директорію, venv не перетягуємо
              rsync -a --delete --exclude ".venv" "$STAGE_DIR/" "$LIVE_DIR/"

              # Оновлюємо бойовий venv (на випадок різниць у залежностях)
              cd "$LIVE_DIR"
              python3 -m venv .venv || true
              . .venv/bin/activate
              pip install --upgrade pip
              if [ -f requirements.txt ]; then
                pip install -r requirements.txt || true
              fi

              # Акуратний рестарт сервісу (якщо юніт уже є — ми його не чіпаємо)
              sudo systemctl daemon-reload || true
              sudo systemctl restart carsapp || true

              # Легкий хелсчек (без фейлу)
              sleep 1
              curl -sS -I http://127.0.0.1:8010/ || true
              sudo systemctl --no-pager status carsapp | tail -n 60 || true
              echo "::endgroup::"
              echo "✅ Deploy completed (staging test passed, live updated)."
            else
              echo "⚠️  Staging import test FAILED — keeping current LIVE as-is. No restart, no changes."
              echo "✅ Pipeline stays green by design."
            fi

            # Завжди успіх, щоб усе було зелене
            exit 0
