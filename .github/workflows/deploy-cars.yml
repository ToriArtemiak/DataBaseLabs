name: Deploy Cars full auto

on:
  push:
    branches: [ lab5 ]
  workflow_dispatch:

concurrency:
  group: cars-deploy-lab5
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare remote dir
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            mkdir -p /home/ubuntu/cars

      - name: Upload project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "**"
          target: "/home/ubuntu/cars"
          overwrite: true
          strip_components: 0

      - name: Fix imports, venv, DB, systemd, restart
        uses: appleboy/ssh-action@v1.0.0
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_DB:   ${{ secrets.RDS_DB }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RDS_HOST,RDS_DB,RDS_USER,RDS_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail

            # 1) базові пакети
            sudo apt-get update -y
            sudo apt-get install -y python3-venv python3-pip mysql-client

            cd /home/ubuntu/cars

            # 2) каталоги як пакети (__init__.py якщо треба)
            for d in controllers dao domain root service; do
              if [ -d "$d" ] && [ ! -f "$d/__init__.py" ]; then
                install -m0644 /dev/null "$d/__init__.py"
              fi
            done

            # 3) прибираємо legacy app.py, що ламає імпорти
            if [ -f app.py ]; then
              mv -f app.py legacy_app.py
            fi

            # 4) масові фікси імпортів
            # 4.1) з '..' на абсолютні
            sed -i \
              -e "s/from \.\.domain\./from domain./g" \
              -e "s/from \.\.domain import /from domain import /g" \
              root/*.py service/*.py dao/*.py controllers/*.py 2>/dev/null || true

            sed -i \
              -e "s/from \.\.service\./from service./g" \
              -e "s/from \.\.service import /from service import /g" \
              root/*.py service/*.py controllers/*.py 2>/dev/null || true

            sed -i \
              -e "s/from \.\.controllers\./from controllers./g" \
              -e "s/from \.\.controllers import /from controllers import /g" \
              root/*.py service/*.py controllers/*.py 2>/dev/null || true

            sed -i \
              -e "s/from \.\.dao\./from dao./g" \
              -e "s/from \.\.dao import /from dao import /g" \
              root/*.py service/*.py controllers/*.py 2>/dev/null || true

            sed -i "s/from \.\. import db/from __init__ import db/g" root/*.py service/*.py 2>/dev/null || true

            # 4.2) прибираємо префікс 'app.' і прямі імпорти з 'app'
            grep -RIl --include="*.py" "from app\." . | xargs -r sed -i 's/from app\./from /g'
            grep -RIl --include="*.py" "import app\." . | xargs -r sed -i 's/import app\./import /g'
            grep -RIl --include="*.py" "^from app import " . | xargs -r sed -i 's/^from app import /from __init__ import /g'
            # спеціально: db та register_routes, якщо десь лишилось
            grep -RIl --include="*.py" "from app import db" . | xargs -r sed -i "s/from app import db/from __init__ import db/g"
            sed -i "s/from app\.root import register_routes/from root import register_routes/" __init__.py 2>/dev/null || true

            # 4.3) перевірка: не повинно лишитись 'from ..'
            if grep -RIn --include="*.py" "from \.\." . | grep -v "/\.venv/" ; then
              echo "ERROR: Leftover relative imports (..). Fix needed."; exit 1
            fi

            # 5) wsgi.py — БЕЗ heredoc
            printf '%s\n' \
              'from __init__ import create_app' \
              'app = create_app()' > wsgi.py

            # 6) venv + залежності
            python3 -m venv .venv || true
            . .venv/bin/activate
            pip install --upgrade pip
            [ -f requirements.txt ] && pip install -r requirements.txt || true
            pip install "Flask==2.3.3" "Flask-RESTful==0.3.10"

            # 7) швидкий імпорт-тест
            /home/ubuntu/cars/.venv/bin/python -c 'import sys; sys.path.insert(0,"/home/ubuntu/cars"); from wsgi import app; print("WSGI OK:", bool(app))'

            # 8) БД: створення + seed якщо порожня
            mysql -h "$RDS_HOST" -u "$RDS_USER" -p"$RDS_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS \`$RDS_DB\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            TABLES_CNT=$(mysql -N -h "$RDS_HOST" -u "$RDS_USER" -p"$RDS_PASSWORD" -D "$RDS_DB" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$RDS_DB';" || echo 0)
            if [ "${TABLES_CNT:-0}" -eq 0 ] && [ -f data.sql ]; then
              echo "DB empty -> applying data.sql"
              mysql -h "$RDS_HOST" -u "$RDS_USER" -p"$RDS_PASSWORD" "$RDS_DB" < data.sql
            else
              echo "DB has ${TABLES_CNT:-?} tables -> skip seed"
            fi

            # 9) systemd unit — БЕЗ heredoc
            printf '%s\n' \
              '[Unit]' \
              'Description=Cars Flask App' \
              'After=network-online.target' \
              '' \
              '[Service]' \
              'User=ubuntu' \
              'WorkingDirectory=/home/ubuntu/cars' \
              'Environment=PYTHONUNBUFFERED=1' \
              "Environment=DATABASE_URL=mysql+pymysql://$RDS_USER:$RDS_PASSWORD@$RDS_HOST:3306/$RDS_DB" \
              'ExecStart=/home/ubuntu/cars/.venv/bin/gunicorn -w 2 -b 0.0.0.0:8010 wsgi:app' \
              'Restart=always' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              | sudo tee /etc/systemd/system/carsapp.service > /dev/null

            sudo systemctl daemon-reload
            sudo systemctl enable carsapp
            sudo systemctl restart carsapp

            # 10) healthcheck + логи
            sleep 1
            curl -sS -I http://127.0.0.1:8010/ || true
            curl -sS http://127.0.0.1:8010/docs | head || true
            sudo systemctl --no-pager status carsapp | tail -n 60
            journalctl -u carsapp --since "2 minutes ago" --no-pager || true
