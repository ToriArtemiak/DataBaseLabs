name: Lab-3

on:
  push:
    branches: ["lab5"]

env:
  AWS_REGION: us-east-1

  RDS_ID: iotlab-db1-last-lab
  DB_NAME: iotlab
  DB_USER: admin
  DB_MASTER_PASS: root1234
  RDS_SG_NAME: iotlab-rds-sg-last-lab
  LAMBDA_SG_NAME: iotlab-lambda-sg-last-lab

  SQS_NAME: iotlab-queue-last-lab
  INGEST_LAMBDA: iotlab-ingest-last-lab
  CONSUMER_LAMBDA: iotlab-consumer-last-lab
  HISTORY_LAMBDA: iotlab-history-last-lab
  LAMBDA_ROLE: iotlab-lambda-role-last-lab
  API_NAME: iotlab-api-last-lab
  STAGE: prod

jobs:
  deploy-iot-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve VPC + subnets
        run: |
          set -e
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$VPC_ID --query 'Subnets[?MapPublicIpOnLaunch==`true`].SubnetId' --output text)
          SUBNET1=$(echo $SUBNETS | awk '{print $1}')
          SUBNET2=$(echo $SUBNETS | awk '{print $2}')
          if [ -z "$SUBNET1" ] || [ -z "$SUBNET2" ] || [ "$SUBNET1" = "None" ] || [ "$SUBNET2" = "None" ]; then
            echo "Need >=2 public subnets in default VPC"
            exit 1
          fi
          echo "VPC_ID=$VPC_ID"   >> $GITHUB_ENV
          echo "SUBNET1=$SUBNET1" >> $GITHUB_ENV
          echo "SUBNET2=$SUBNET2" >> $GITHUB_ENV

      - name: Security groups (RDS + Lambda)
        run: |
          set -e
          LAMBDA_SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values="$LAMBDA_SG_NAME" Name=vpc-id,Values="$VPC_ID" --query 'SecurityGroups[0].GroupId' --output text)
          if [ "$LAMBDA_SG_ID" = "None" ] || [ -z "$LAMBDA_SG_ID" ]; then
            LAMBDA_SG_ID=$(aws ec2 create-security-group --group-name "$LAMBDA_SG_NAME" --description "IoT Lab Lambda SG" --vpc-id "$VPC_ID" --query 'GroupId' --output text)
          fi
          aws ec2 revoke-security-group-egress --group-id "$LAMBDA_SG_ID" --ip-permissions '[{"IpProtocol":"-1","IpRanges":[{"CidrIp":"0.0.0.0/0"}]}]' >/dev/null 2>&1 || true
          aws ec2 authorize-security-group-egress --group-id "$LAMBDA_SG_ID" --ip-permissions '[{"IpProtocol":"-1","IpRanges":[{"CidrIp":"0.0.0.0/0"}]}]' >/dev/null 2>&1 || true

          RDS_SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values="$RDS_SG_NAME" Name=vpc-id,Values="$VPC_ID" --query 'SecurityGroups[0].GroupId' --output text)
          if [ "$RDS_SG_ID" = "None" ] || [ -z "$RDS_SG_ID" ]; then
            RDS_SG_ID=$(aws ec2 create-security-group --group-name "$RDS_SG_NAME" --description "IoT Lab RDS SG" --vpc-id "$VPC_ID" --query 'GroupId' --output text)
          fi
          aws ec2 authorize-security-group-ingress --group-id "$RDS_SG_ID" --protocol tcp --port 3306 --source-group "$LAMBDA_SG_ID" >/dev/null 2>&1 || true
          aws ec2 authorize-security-group-ingress --group-id "$RDS_SG_ID" --protocol tcp --port 3306 --cidr 0.0.0.0/0 >/dev/null 2>&1 || true

          echo "LAMBDA_SG_ID=$LAMBDA_SG_ID" >> $GITHUB_ENV
          echo "RDS_SG_ID=$RDS_SG_ID"       >> $GITHUB_ENV

      - name: Create/modify RDS MySQL (PUBLIC + set password)
        run: |
          set -e
          if ! aws rds describe-db-instances --db-instance-identifier "$RDS_ID" >/dev/null 2>&1; then
            aws rds create-db-instance \
              --db-instance-identifier "$RDS_ID" \
              --engine mysql \
              --db-instance-class db.t4g.micro \
              --allocated-storage 20 \
              --master-username "$DB_USER" \
              --master-user-password "$DB_MASTER_PASS" \
              --vpc-security-group-ids "$RDS_SG_ID" \
              --db-name "$DB_NAME" \
              --publicly-accessible \
              --no-multi-az \
              --backup-retention-period 0 \
              --storage-type gp2
          else
            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_ID" \
              --publicly-accessible \
              --master-user-password "$DB_MASTER_PASS" \
              --apply-immediately
          fi
          aws rds wait db-instance-available --db-instance-identifier "$RDS_ID"
          DB_HOST=$(aws rds describe-db-instances --db-instance-identifier "$RDS_ID" --query 'DBInstances[0].Endpoint.Address' --output text)
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "RDS endpoint: $DB_HOST"

      - name: Create SQS queue
        run: |
          set -e
          aws sqs create-queue --queue-name "$SQS_NAME" >/dev/null 2>&1 || true
          QUEUE_URL=$(aws sqs get-queue-url --queue-name "$SQS_NAME" --query 'QueueUrl' --output text)
          QUEUE_ARN=$(aws sqs get-queue-attributes --queue-url "$QUEUE_URL" --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)
          echo "QUEUE_URL=$QUEUE_URL" >> $GITHUB_ENV
          echo "QUEUE_ARN=$QUEUE_ARN" >> $GITHUB_ENV

      - name: IAM role for Lambdas
        run: |
          set -e
          TRUST='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
          if ! aws iam get-role --role-name "$LAMBDA_ROLE" >/dev/null 2>&1; then
            aws iam create-role --role-name "$LAMBDA_ROLE" --assume-role-policy-document "$TRUST" >/dev/null
          fi
          aws iam attach-role-policy --role-name "$LAMBDA_ROLE" --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole >/dev/null 2>&1 || true
          aws iam attach-role-policy --role-name "$LAMBDA_ROLE" --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole >/dev/null 2>&1 || true
          aws iam attach-role-policy --role-name "$LAMBDA_ROLE" --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole >/dev/null 2>&1 || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          cat > sqs-send.json <<'EOF'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["sqs:SendMessage"],"Resource":"__QUEUE_ARN__"}]}
          EOF
          sed -i "s|__QUEUE_ARN__|$QUEUE_ARN|g" sqs-send.json
          if ! aws iam get-policy --policy-arn arn:aws:iam::$ACCOUNT_ID:policy/iotlab-sqs-send-last-lab >/dev/null 2>&1; then
            aws iam create-policy --policy-name iotlab-sqs-send-last-lab --policy-document file://sqs-send.json >/dev/null
          fi
          aws iam attach-role-policy --role-name "$LAMBDA_ROLE" --policy-arn arn:aws:iam::$ACCOUNT_ID:policy/iotlab-sqs-send-last-lab >/dev/null 2>&1 || true

          cat > rds-read.json <<'EOF'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["rds:DescribeDBInstances"],"Resource":"*"}]}
          EOF
          if ! aws iam get-policy --policy-arn arn:aws:iam::$ACCOUNT_ID:policy/iotlab-rds-describe-last-lab >/dev/null 2>&1; then
            aws iam create-policy --policy-name iotlab-rds-describe-last-lab --policy-document file://rds-read.json >/dev/null
          fi
          aws iam attach-role-policy --role-name "$LAMBDA_ROLE" --policy-arn arn:aws:iam::$ACCOUNT_ID:policy/iotlab-rds-describe-last-lab >/dev/null 2>&1 || true

          ROLE_ARN=$(aws iam get-role --role-name "$LAMBDA_ROLE" --query 'Role.Arn' --output text)
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      - name: Build & deploy Lambdas (ingest -> SQS, consumer SQS -> MySQL, history -> MySQL)
        run: |
          set -e
          wait_lambda_ok () {
            FN="$1"
            for i in $(seq 1 60); do
              STATUS=$(aws lambda get-function-configuration --function-name "$FN" --query 'LastUpdateStatus' --output text 2>/dev/null || echo "Unknown")
              if [ "$STATUS" = "Successful" ] || [ "$STATUS" = "Unknown" ]; then break; fi
              if [ "$STATUS" = "Failed" ]; then echo "Lambda $FN last update FAILED"; exit 1; fi
              sleep 3
            done
          }

          mkdir -p lambda_ingest lambda_consumer lambda_history

          cat > lambda_ingest/handler.py <<'PY'
          import os, json, time, base64, boto3
          sqs = boto3.client("sqs")
          QUEUE_URL = os.environ["QUEUE_URL"]
          def _parse_body(event):
              body = event.get("body") or "{}"
              if event.get("isBase64Encoded"):
                  body = base64.b64decode(body).decode("utf-8")
              return json.loads(body)
          def lambda_handler(event, context):
              payload = _parse_body(event)
              payload.setdefault("ts", int(time.time() * 1000))
              sqs.send_message(QueueUrl=QUEUE_URL, MessageBody=json.dumps(payload, ensure_ascii=False))
              return {
                  "statusCode": 202,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({"ok": True})
              }
          PY

          cat > lambda_consumer/handler.py <<'PY'
          import os, json, time, pymysql
          DB_HOST = os.environ["DB_HOST"]
          DB_NAME = os.environ["DB_NAME"]
          DB_USER = os.environ["DB_USER"]
          DB_PASS = os.environ["DB_PASS"]
          def _conn():
              return pymysql.connect(
                  host=DB_HOST,
                  user=DB_USER,
                  password=DB_PASS,
                  database=DB_NAME,
                  autocommit=True,
                  charset="utf8mb4",
                  connect_timeout=10
              )
          def _init_schema(cur):
              cur.execute("""
              CREATE TABLE IF NOT EXISTS sensor_data (
                id BIGINT AUTO_INCREMENT PRIMARY KEY,
                sensor_type VARCHAR(32) NOT NULL,
                temp_c DOUBLE NULL,
                humidity_pct DOUBLE NULL,
                light_lux DOUBLE NULL,
                lat DOUBLE NULL,
                lon DOUBLE NULL,
                ts BIGINT NOT NULL,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                INDEX idx_type_ts (sensor_type, ts)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              """)
          def _extract_fields(p):
              t = (p.get("type") or "").lower()
              temp_c = p.get("temp_c")
              humidity_pct = p.get("humidity_pct")
              light_lux = p.get("light_lux")
              if p.get("value") is not None:
                  v = float(p["value"])
                  if t == "temperature" and temp_c is None:
                      temp_c = v
                  elif t == "humidity" and humidity_pct is None:
                      humidity_pct = v
                  elif t == "light" and light_lux is None:
                      light_lux = v
              return t, temp_c, humidity_pct, light_lux
          def lambda_handler(event, context):
              con = _conn()
              try:
                  with con.cursor() as cur:
                      _init_schema(cur)
                      for rec in event.get("Records", []):
                          p = json.loads(rec["body"])
                          sensor_type, temp_c, humidity_pct, light_lux = _extract_fields(p)
                          ts = int(p.get("ts", time.time() * 1000))
                          cur.execute(
                              """
                              INSERT INTO sensor_data(sensor_type, temp_c, humidity_pct, light_lux, lat, lon, ts)
                              VALUES (%s,%s,%s,%s,%s,%s,%s)
                              """,
                              (sensor_type, temp_c, humidity_pct, light_lux, p.get("lat"), p.get("lon"), ts)
                          )
              finally:
                  con.close()
              return {"ok": True}
          PY

          cat > lambda_history/handler.py <<'PY'
          import os, json, pymysql
          DB_HOST = os.environ["DB_HOST"]
          DB_NAME = os.environ["DB_NAME"]
          DB_USER = os.environ["DB_USER"]
          DB_PASS = os.environ["DB_PASS"]
          def _conn():
              return pymysql.connect(
                  host=DB_HOST,
                  user=DB_USER,
                  password=DB_PASS,
                  database=DB_NAME,
                  autocommit=True,
                  charset="utf8mb4",
                  connect_timeout=10,
                  cursorclass=pymysql.cursors.DictCursor
              )
          def _init_schema(cur):
              cur.execute("""
              CREATE TABLE IF NOT EXISTS sensor_data (
                id BIGINT AUTO_INCREMENT PRIMARY KEY,
                sensor_type VARCHAR(32) NOT NULL,
                temp_c DOUBLE NULL,
                humidity_pct DOUBLE NULL,
                light_lux DOUBLE NULL,
                lat DOUBLE NULL,
                lon DOUBLE NULL,
                ts BIGINT NOT NULL,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                INDEX idx_type_ts (sensor_type, ts)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
              """)
          def _resp(code, obj):
              return {
                  "statusCode": code,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  "body": json.dumps(obj, ensure_ascii=False)
              }
          def lambda_handler(event, context):
              qs = event.get("queryStringParameters") or {}
              sensor_type = (qs.get("type") or "").lower().strip()
              limit = int(qs.get("limit") or "50")
              if limit < 1: limit = 1
              if limit > 500: limit = 500
              con = _conn()
              try:
                  with con.cursor() as cur:
                      _init_schema(cur)
                      if sensor_type:
                          cur.execute(
                              """
                              SELECT id, sensor_type, temp_c, humidity_pct, light_lux, lat, lon, ts, created_at
                              FROM sensor_data
                              WHERE sensor_type = %s
                              ORDER BY id DESC
                              LIMIT %s
                              """,
                              (sensor_type, limit)
                          )
                      else:
                          cur.execute(
                              """
                              SELECT id, sensor_type, temp_c, humidity_pct, light_lux, lat, lon, ts, created_at
                              FROM sensor_data
                              ORDER BY id DESC
                              LIMIT %s
                              """,
                              (limit,)
                          )
                      rows = cur.fetchall()
              finally:
                  con.close()
              return _resp(200, {"ok": True, "items": rows})
          PY

          python -m pip install --upgrade pip >/dev/null
          pip install -q -t lambda_consumer/python pymysql
          pip install -q -t lambda_history/python pymysql

          (cd lambda_ingest && zip -rq ../ingest.zip .)
          (cd lambda_consumer && zip -rq ../consumer_layer.zip python)
          (cd lambda_consumer && zip -rq ../consumer_code.zip handler.py)
          (cd lambda_history && zip -rq ../history_layer.zip python)
          (cd lambda_history && zip -rq ../history_code.zip handler.py)

          LAYER_CONSUMER_ARN=$(aws lambda publish-layer-version --layer-name iotlab-pymysql-consumer-last-lab --zip-file fileb://consumer_layer.zip --compatible-runtimes python3.12 --query 'LayerVersionArn' --output text)
          LAYER_HISTORY_ARN=$(aws lambda publish-layer-version --layer-name iotlab-pymysql-history-last-lab --zip-file fileb://history_layer.zip --compatible-runtimes python3.12 --query 'LayerVersionArn' --output text)

          if aws lambda get-function --function-name "$INGEST_LAMBDA" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$INGEST_LAMBDA" --zip-file fileb://ingest.zip >/dev/null
            wait_lambda_ok "$INGEST_LAMBDA"
            aws lambda update-function-configuration --function-name "$INGEST_LAMBDA" \
              --environment "Variables={QUEUE_URL=$QUEUE_URL}" >/dev/null
            wait_lambda_ok "$INGEST_LAMBDA"
          else
            aws lambda create-function --function-name "$INGEST_LAMBDA" \
              --runtime python3.12 --handler handler.lambda_handler \
              --role "$ROLE_ARN" --timeout 15 --memory-size 128 \
              --zip-file fileb://ingest.zip \
              --environment "Variables={QUEUE_URL=$QUEUE_URL}" >/dev/null
            wait_lambda_ok "$INGEST_LAMBDA"
          fi

          if aws lambda get-function --function-name "$CONSUMER_LAMBDA" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$CONSUMER_LAMBDA" --zip-file fileb://consumer_code.zip >/dev/null
            wait_lambda_ok "$CONSUMER_LAMBDA"
            aws lambda update-function-configuration --function-name "$CONSUMER_LAMBDA" \
              --layers "$LAYER_CONSUMER_ARN" \
              --vpc-config "SubnetIds=$SUBNET1,$SUBNET2,SecurityGroupIds=$LAMBDA_SG_ID" \
              --environment "Variables={DB_HOST=$DB_HOST,DB_NAME=$DB_NAME,DB_USER=$DB_USER,DB_PASS=$DB_MASTER_PASS}" >/dev/null
            wait_lambda_ok "$CONSUMER_LAMBDA"
          else
            aws lambda create-function --function-name "$CONSUMER_LAMBDA" \
              --runtime python3.12 --handler handler.lambda_handler \
              --role "$ROLE_ARN" --timeout 30 --memory-size 256 \
              --zip-file fileb://consumer_code.zip \
              --layers "$LAYER_CONSUMER_ARN" \
              --vpc-config "SubnetIds=$SUBNET1,$SUBNET2,SecurityGroupIds=$LAMBDA_SG_ID" \
              --environment "Variables={DB_HOST=$DB_HOST,DB_NAME=$DB_NAME,DB_USER=$DB_USER,DB_PASS=$DB_MASTER_PASS}" >/dev/null
            wait_lambda_ok "$CONSUMER_LAMBDA"
          fi

          if aws lambda get-function --function-name "$HISTORY_LAMBDA" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$HISTORY_LAMBDA" --zip-file fileb://history_code.zip >/dev/null
            wait_lambda_ok "$HISTORY_LAMBDA"
            aws lambda update-function-configuration --function-name "$HISTORY_LAMBDA" \
              --layers "$LAYER_HISTORY_ARN" \
              --vpc-config "SubnetIds=$SUBNET1,$SUBNET2,SecurityGroupIds=$LAMBDA_SG_ID" \
              --environment "Variables={DB_HOST=$DB_HOST,DB_NAME=$DB_NAME,DB_USER=$DB_USER,DB_PASS=$DB_MASTER_PASS}" >/dev/null
            wait_lambda_ok "$HISTORY_LAMBDA"
          else
            aws lambda create-function --function-name "$HISTORY_LAMBDA" \
              --runtime python3.12 --handler handler.lambda_handler \
              --role "$ROLE_ARN" --timeout 30 --memory-size 256 \
              --zip-file fileb://history_code.zip \
              --layers "$LAYER_HISTORY_ARN" \
              --vpc-config "SubnetIds=$SUBNET1,$SUBNET2,SecurityGroupIds=$LAMBDA_SG_ID" \
              --environment "Variables={DB_HOST=$DB_HOST,DB_NAME=$DB_NAME,DB_USER=$DB_USER,DB_PASS=$DB_MASTER_PASS}" >/dev/null
            wait_lambda_ok "$HISTORY_LAMBDA"
          fi

          MAPPING_ID=$(aws lambda list-event-source-mappings --function-name "$CONSUMER_LAMBDA" --query "EventSourceMappings[?EventSourceArn=='$QUEUE_ARN'].UUID | [0]" --output text)
          if [ -z "$MAPPING_ID" ] || [ "$MAPPING_ID" = "None" ]; then
            aws lambda create-event-source-mapping --function-name "$CONSUMER_LAMBDA" --event-source-arn "$QUEUE_ARN" --batch-size 10 >/dev/null
          fi

      - name: API Gateway routes (POST /ingest, GET /history)
        run: |
          set -e
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='$API_NAME'].id | [0]" --output text)
          if [ "$API_ID" = "None" ] || [ -z "$API_ID" ]; then
            API_ID=$(aws apigateway create-rest-api --name "$API_NAME" --query 'id' --output text)
          fi

          ROOT_ID=$(aws apigateway get-resources --rest-api-id "$API_ID" --query "items[?path=='/'].id" --output text)

          ING_ID=$(aws apigateway get-resources --rest-api-id "$API_ID" --query "items[?path=='/ingest'].id" --output text)
          if [ "$ING_ID" = "None" ] || [ -z "$ING_ID" ]; then
            ING_ID=$(aws apigateway create-resource --rest-api-id "$API_ID" --parent-id "$ROOT_ID" --path-part ingest --query 'id' --output text)
          fi

          HIS_ID=$(aws apigateway get-resources --rest-api-id "$API_ID" --query "items[?path=='/history'].id" --output text)
          if [ "$HIS_ID" = "None" ] || [ -z "$HIS_ID" ]; then
            HIS_ID=$(aws apigateway create-resource --rest-api-id "$API_ID" --parent-id "$ROOT_ID" --path-part history --query 'id' --output text)
          fi

          aws apigateway put-method --rest-api-id "$API_ID" --resource-id "$ING_ID" --http-method POST --authorization-type "NONE" >/dev/null 2>&1 || true
          aws apigateway put-method --rest-api-id "$API_ID" --resource-id "$HIS_ID" --http-method GET  --authorization-type "NONE" >/dev/null 2>&1 || true

          ING_LAMBDA_ARN=$(aws lambda get-function --function-name "$INGEST_LAMBDA" --query 'Configuration.FunctionArn' --output text)
          HIS_LAMBDA_ARN=$(aws lambda get-function --function-name "$HISTORY_LAMBDA" --query 'Configuration.FunctionArn' --output text)

          ING_URI="arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/${ING_LAMBDA_ARN}/invocations"
          HIS_URI="arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/${HIS_LAMBDA_ARN}/invocations"

          aws apigateway put-integration --rest-api-id "$API_ID" --resource-id "$ING_ID" --http-method POST \
            --type AWS_PROXY --integration-http-method POST --uri "$ING_URI" >/dev/null 2>&1 || true

          aws apigateway put-integration --rest-api-id "$API_ID" --resource-id "$HIS_ID" --http-method GET \
            --type AWS_PROXY --integration-http-method POST --uri "$HIS_URI" >/dev/null 2>&1 || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          aws lambda add-permission --function-name "$INGEST_LAMBDA" --statement-id "apigw-post-ingest" \
            --action lambda:InvokeFunction --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${API_ID}/*/POST/ingest" >/dev/null 2>&1 || true

          aws lambda add-permission --function-name "$HISTORY_LAMBDA" --statement-id "apigw-get-history" \
            --action lambda:InvokeFunction --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${API_ID}/*/GET/history" >/dev/null 2>&1 || true

          aws apigateway create-deployment --rest-api-id "$API_ID" --stage-name "$STAGE" >/dev/null

          API_URL="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/${STAGE}"
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "API URL: $API_URL"
          echo "POST  $API_URL/ingest"
          echo "GET   $API_URL/history?type=temperature&limit=50"

      - name: Smoke test (send 3 events + query history)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y curl jq

          curl -s -X POST "$API_URL/ingest" -H 'Content-Type: application/json' \
            -d '{"type":"temperature","temp_c":24.7,"lat":49.84,"lon":24.03,"ts":1733160000000}' >/dev/null
          curl -s -X POST "$API_URL/ingest" -H 'Content-Type: application/json' \
            -d '{"type":"humidity","humidity_pct":55.2,"lat":49.84,"lon":24.03,"ts":1733160000000}' >/dev/null
          curl -s -X POST "$API_URL/ingest" -H 'Content-Type: application/json' \
            -d '{"type":"light","light_lux":350,"lat":49.84,"lon":24.03,"ts":1733160000000}' >/dev/null

          sleep 20

          curl -s "$API_URL/history?limit=5" | jq .
          curl -s "$API_URL/history?type=temperature&limit=5" | jq .

      - name: Print endpoints + MySQL command
        run: |
          echo "POST  ${API_URL}/ingest"
          echo "GET   ${API_URL}/history?type=temperature&limit=50"
          echo "mysql -h ${DB_HOST} -u ${DB_USER} -p'${DB_MASTER_PASS}' ${DB_NAME}"

          cat >> "$GITHUB_STEP_SUMMARY" <<MD
